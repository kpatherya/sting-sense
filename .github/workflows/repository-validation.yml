name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify syntax for core scripts
        run: |
          python -m py_compile bus_routes_app.py
          python -m py_compile all_routes_viz.py
          python -m py_compile all_routes_traffichourfilter.py
          python -m py_compile all_routes_timeseries.py
